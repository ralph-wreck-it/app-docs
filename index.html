<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>患时记 CareTrail · 公开文档</title>
  <meta name="description" content="患时记（CareTrail）公开文档入口：隐私政策与帮助支持，按版本归档，可查看当前版本与历史版本。">
  <meta name="theme-color" content="#2458f5">
  <meta property="og:title" content="患时记 CareTrail · 公开文档">
  <meta property="og:description" content="隐私政策与帮助支持，按版本归档。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%232458f5'/><path d='M18 33h7l4-10 5 20 4-10h8' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3fb;
      --card: rgba(255, 255, 255, 0.9);
      --surface: rgba(255, 255, 255, 0.72);
      --text: #162033;
      --muted: #5e6b82;
      --border: #d8e1ef;
      --accent: #2458f5;
      --accent-soft: rgba(36, 88, 245, 0.1);
      --shadow: 0 20px 50px rgba(20, 34, 66, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0d1424;
        --card: rgba(23, 32, 51, 0.86);
        --surface: rgba(255, 255, 255, 0.05);
        --text: #eaf0fb;
        --muted: #9fb0cc;
        --border: #2a3550;
        --accent: #6f97ff;
        --accent-soft: rgba(111, 151, 255, 0.16);
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(36, 88, 245, 0.14), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    }

    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(circle at top, rgba(36, 88, 245, 0.22), transparent 30%),
          linear-gradient(180deg, #131c2e 0%, var(--bg) 100%);
      }
    }

    .card {
      width: min(100%, 680px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 1.02rem;
    }

    .group {
      margin-top: 28px;
    }

    .group-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .group-head h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
      color: var(--muted);
      font-weight: 700;
    }

    .tag {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
    }

    .tag.muted {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .links {
      display: grid;
      gap: 10px;
    }

    a.item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    a.item:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(36, 88, 245, 0.16);
    }

    a.item .meta {
      font-weight: 500;
      font-size: 0.86rem;
      color: var(--muted);
      white-space: nowrap;
    }

    a.item .arrow {
      color: var(--accent);
      font-weight: 700;
    }

    a.item:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      padding: 1px 5px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    @media (prefers-color-scheme: dark) {
      .tag {
        background: var(--accent-soft);
        color: var(--accent);
      }

      a.item:hover {
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 22px;
      }

      a.item {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">患时记 CareTrail</div>
    <h1>公开文档</h1>
    <p class="lede">隐私政策与帮助支持页面按 App 版本归档。建议优先查看当前版本；历史版本仅作存档保留，供核对旧版条款使用。</p>

    <section class="group" aria-labelledby="current-version">
      <div class="group-head">
        <h2 id="current-version">当前版本 2.0.0</h2>
        <span class="tag">最新</span>
      </div>
      <nav class="links" aria-label="2.0.0 文档">
        <a class="item" href="./caretrail/2.0.0/privacy-policy.html">
          <span>隐私政策 <span class="arrow">→</span></span>
          <span class="meta">更新于 2026 年 9 月 16 日</span>
        </a>
        <a class="item" href="./caretrail/2.0.0/support.html">
          <span>帮助与支持 <span class="arrow">→</span></span>
          <span class="meta">2.0.0</span>
        </a>
      </nav>
    </section>

    <section class="group" aria-labelledby="past-versions">
      <div class="group-head">
        <h2 id="past-versions">历史版本 1.x</h2>
        <span class="tag muted">已归档</span>
      </div>
      <nav class="links" aria-label="1.x 历史文档">
        <a class="item" href="./caretrail/privacy-policy.html">
          <span>隐私政策 <span class="arrow">→</span></span>
          <span class="meta">更新于 2026 年 6 月 15 日</span>
        </a>
        <a class="item" href="./caretrail/support.html">
          <span>帮助与支持 <span class="arrow">→</span></span>
          <span class="meta">1.x</span>
        </a>
      </nav>
    </section>

    <footer>
      文档入口最近整理：2026 年 9 月 18 日<br>
      若链接无法打开，请确认访问地址包含 <code>/caretrail/</code> 路径。
    </footer>
  </main>
</body>
</html>
