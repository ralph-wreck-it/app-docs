              "When iCloud Sync is on, the replacement result of an import may sync to your other devices."
            ]
          },
          {
            title: "6. Data Deletion",
            bullets: [
              "Delete members, illnesses, records, or attachments in the app.",
              "Uninstalling the app removes local data from this device only; it does not erase data already synced to your iCloud account."
            ]
          },
          {
            title: "7. Third-Party Services",
            paragraphs: [
              "The app does not use third-party advertising, analytics, crash-reporting, or tracking services. Optional iCloud Sync uses Apple's private iCloud database under your own Apple ID. In-app purchases are processed by the Apple App Store. The app uses StoreKit transaction entitlement status to unlock features; the developer does not receive payment credentials or process purchases on a developer-operated server, and health records are not accessed for purchase verification."
            ]
          },
          {
            title: "8. Children's Privacy",
            paragraphs: [
              "The app can record health information for family members, including minors. Data stays on the parent or guardian's device by default; when sync is enabled, it is stored in that Apple ID's private iCloud database. The developer does not receive this content on developer-operated servers."
            ]
          },
          {
            title: "9. Policy Updates",
            paragraphs: [
              "If this policy changes, we will update it in the app or through other official channels."
            ]
          },
          {
            title: "10. Contact Us",
            paragraphs: [
              "If you have any questions about this privacy policy, contact:"
            ],
            contact: "teng7922@126.com"
          }
        ]
      }
    };

    const contentEl = document.getElementById("policyContent");
    const titleEl = document.getElementById("policyTitle");
    const subtitleEl = document.getElementById("policySubtitle");
    const updatedEl = document.getElementById("policyUpdated");
    const updatedLabelEl = document.getElementById("updatedLabel");
    const contactLabelEl = document.getElementById("contactLabel");
    const emailEl = document.getElementById("policyEmail");
    const footerEl = document.getElementById("policyFooter");
    const switcherEl = document.getElementById("langSwitcher");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderSection(section) {
      const paragraphs = (section.paragraphs || [])
        .map((text) => `<p>${escapeHtml(text)}</p>`)
        .join("");
      const bullets = (section.bullets || []).length
        ? `<ul>${section.bullets.map((text) => `<li>${escapeHtml(text)}</li>`).join("")}</ul>`
        : "";
      const contact = section.contact
        ? `<div class="contact-grid"><div class="contact-box"><span class="contact-label">${escapeHtml(currentPolicy.contactLabel)}</span><span class="contact-value"><a href="mailto:${escapeHtml(section.contact)}">${escapeHtml(section.contact)}</a></span></div></div>`
        : "";
      return `
        <section class="card">
          <h2>${escapeHtml(section.title)}</h2>
          ${paragraphs}
          ${bullets}
          ${contact}
        </section>
      `;
    }

    function renderSwitcher(activeKey) {
      switcherEl.innerHTML = currentPolicy.languages.map((item) => `
        <button
          class="lang-button"
          type="button"
          role="tab"
          aria-pressed="${item.key === activeKey ? "true" : "false"}"
          data-lang="${item.key}"
        >${escapeHtml(item.label)}</button>
      `).join("");
    }

    let currentPolicy = policies["zh-Hans"];

    function setLanguage(lang) {
      currentPolicy = policies[lang] || policies["zh-Hans"];
      document.documentElement.lang = lang;
      document.title = currentPolicy.title;
      titleEl.textContent = currentPolicy.title;
      subtitleEl.textContent = currentPolicy.subtitle;
      updatedEl.textContent = currentPolicy.updated;
      updatedLabelEl.textContent = currentPolicy.updatedLabel;
      contactLabelEl.textContent = currentPolicy.contactLabel;
      emailEl.textContent = currentPolicy.contact;
      emailEl.href = `mailto:${currentPolicy.contact}`;
      footerEl.textContent = currentPolicy.footer;
      contentEl.innerHTML = [
        currentPolicy.note
          ? `<section class="note">${escapeHtml(currentPolicy.note)}</section>`
          : "",
        ...currentPolicy.sections.map(renderSection)
      ].join("");
      renderSwitcher(lang);
      switcherEl.querySelectorAll("button[data-lang]").forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });
    }

    const detected = (() => {
      const locale = (navigator.language || "zh-Hans").toLowerCase();
      if (locale.startsWith("zh-hant") || locale.startsWith("zh-tw") || locale.startsWith("zh-hk")) {
        return "zh-Hant";
      }
      if (locale.startsWith("en")) {
        return "en";
      }
      return "zh-Hans";
    })();

    setLanguage(detected);
  </script>
</body>
</html>
